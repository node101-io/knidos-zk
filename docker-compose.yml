services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: knidos-zk:latest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - circuit-target:/app/circuit/target
    command: ["node", "dist/src/app.js"]

  server:
    image: knidos-zk:latest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      node:
        condition: service_started
    command: ["node", "dist/src/server.js"]
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 10s
      restart_policy:
        condition: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/docs',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
  circuit-target:
