name: knidos

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: knidos-zk:latest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - circuit-target:/app/circuit/target
    command: ['node', 'packages/zk-node/dist/src/app.js']

  success-monitor:
    image: knidos-zk:latest
    restart: unless-stopped
    environment:
      APPRISE_NOTIFY_URL: '${APPRISE_NOTIFY_URL:?set APPRISE_NOTIFY_URL in .env}'
      APPRISE_PASSWORD: '${APPRISE_PASSWORD:?set APPRISE_PASSWORD in .env}'
      APPRISE_USERNAME: '${APPRISE_USERNAME:?set APPRISE_USERNAME in .env}'
      BINANCE_SYMBOLS: '${BINANCE_SYMBOLS:?set BINANCE_SYMBOLS in .env}'
      MONGO_URI: '${MONGO_URI}'
      ZKTLS_WINDOW_MINUTES: '${ZKTLS_WINDOW_MINUTES:-60}'
    command: ['node', 'packages/zk-node/dist/src/success-monitor.js']

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: knidos-zk:latest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      node:
        condition: service_started
    command: ['node', 'packages/zk-node/dist/src/server.js']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/docs',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  challenge-api:
    build:
      context: .
      dockerfile: packages/testnet-challenge/Dockerfile.api
    image: knidos-challenge-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3001'
    ports:
      - '3001:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
  circuit-target:
