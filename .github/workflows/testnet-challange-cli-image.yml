name: testnet-challange-cli image

# Manual trigger only. Two parallel jobs build amd64 and arm64 natively on
# their own GitHub-hosted runners (no QEMU emulation tax). A final `merge`
# job stitches both digests into a single multi-arch manifest list and
# publishes `latest` + the short SHA tag.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/node101-io/knidos-challenge

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/testnet-challange/Dockerfile
          platforms: ${{ matrix.platform }}
          # `push-by-digest` uploads a single-arch image referenced only by
          # digest; the merge job assembles the manifest list afterward.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          # docker/build-push-action@v6 exposes the pushed image digest via
          # the `digest` output. Save it under a per-platform filename so
          # the merge job can collect both.
          digest='${{ steps.build.outputs.digest }}'
          platform='${{ matrix.platform }}'
          echo "$digest" > "/tmp/digests/${platform//\//-}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest + push tags
        working-directory: /tmp/digests
        run: |
          short_sha="${GITHUB_SHA::7}"
          # `imagetools create` takes per-arch digest refs and produces a
          # manifest list, tagging it with both `latest` and the short SHA.
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${short_sha}" \
            $(printf "${IMAGE}@%s " $(cat *))
