name: testnet-challange-cli image

on:
  push:
    branches: [main]
    paths:
      - 'packages/testnet-challange/**'
      - 'circuit/target/circuit.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/testnet-challange-cli-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/node101-io/knidos-challenge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/testnet-challange/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
